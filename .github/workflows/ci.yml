name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest
      - name: Test
        run: pytest -q

  solvers:
    name: differential vs real solvers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install certkit and z3
        # The z3-solver wheel ships the `z3` binary, so this needs no apt and no
        # pinned download URL that could 404 later.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest z3-solver
      - name: Install cvc5 (best effort -- a second, independent implementation)
        run: sudo apt-get update -qq && sudo apt-get install -y cvc5 || echo "cvc5 unavailable; z3 still gates this job"
      - name: Cross-check the SMT-LIB bridge
        # CERTKIT_REQUIRE_SOLVERS turns "no solver found" from a silent skip into
        # a failure, so this job cannot go green without actually running a solver.
        env:
          CERTKIT_REQUIRE_SOLVERS: "1"
        run: pytest -q tests/test_smtlib.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.2
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
